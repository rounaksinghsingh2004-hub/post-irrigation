name: Import Project Source
on:
  push:
    paths:
      - 'upload/post-irrigation-project.tar.gz.b64'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract source archive and commit project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/post-irrigation-import
          base64 --decode upload/post-irrigation-project.tar.gz.b64 | tar -xz -C /tmp/post-irrigation-import
          cp -a /tmp/post-irrigation-import/. .
          rm -rf upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete post-harvest loss intelligence project"
          git push origin HEAD:main
